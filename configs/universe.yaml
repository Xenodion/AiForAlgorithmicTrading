# Monitored underlyings and option chain settings
# Start with Eurostoxx 50 (ESTX50 / SX5E) - easier to test than S&P 500
underlyings:
  - symbol: "SX5E"
    sec_type: "IND"          # Index
    exchange: "EUREX"
    currency: "EUR"
    futures_exchange: "EUREX"
    label: "Eurostoxx 50"
    option_trading_class: "OESX"  # disambiguates option contracts
    future_trading_class: "FESX"  # selects FESX (10x multiplier) over FSXE (1x)

  # Uncomment to add S&P 500 later
  # - symbol: "SPX"
  #   sec_type: "IND"
  #   exchange: "CBOE"
  #   currency: "USD"
  #   label: "S&P 500"

option_chain:
  # Maturities to monitor (in months from today)
  maturity_windows_months: [1, 2, 3, 6, 9, 12, 18]
  # Strike selection: exchange-listed strikes within an ASYMMETRIC band
  # around spot - down to -put_band (deep OTM puts, where the index skew
  # lives) and up to +call_band (OTM calls). OTM puts below ATM, OTM calls
  # above, both Put and Call at the ATM strike. When the band holds more than
  # max_strikes, strikes are sampled evenly across the range (keeping the
  # wings) rather than only the closest to spot. The real per-contract Delta
  # from IBKR is shown in the "Delta" column.
  put_band_pct: 0.25
  call_band_pct: 0.10
  max_strikes_per_expiry: 40
  min_open_interest: 10

futures:
  # Tenors to monitor (in days/months)
  tenors: ["10d", "1m", "2m", "3m", "6m", "9m", "12m", "18m", "24m", "36m"]
  # Maturities to discover for the futures chain (in months from today),
  # 1:1 aligned with `tenors` above (0 ~= 10 days)
  maturity_windows_months: [0, 1, 2, 3, 6, 9, 12, 18, 24, 36]
